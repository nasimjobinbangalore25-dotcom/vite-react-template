<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Media Layout</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styling */
        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.5rem;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #38bdf8;
        }

        /* Main Content Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1; /* Pushes footer to bottom if content is short */
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: 2fr 1fr; /* Video takes more space, image on the side */
            }
        }

        /* Media Cards Styling */
        .card {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: #0f172a;
        }

        /* Responsive Video Container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background: #000;
        }
        .video-container video, 
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive Image Styling */
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            object-fit: cover;
        }

        /* Footer Styling */
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            font-size: 0.9rem;
        }
    </style>
</head>

<link rel="icon" type="image/svg+xml" href="/vite.svg" />
<body>

<div id="root"></div>



    <header>
        <div class="header-container">
            <h1>MediaHub</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Contact</a>
                <a href="#">About</a>
                
<a href="#">Service</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="card">
            <h2>Featured Video</h2>
            <div class="video-container">
                <video controls poster="https://via.placeholder.com/800x450/000000/ffffff?text=Video+Poster">
                    <source src="movie.mp4" type="video/mp4">
                    Your browser does not support the video tag.






                </video>

            </div>



<div>

<iframe width="560" height="315" src="https://www.youtube.com/embed/czkchGvRS0M?si=KhYLybhDyaefGODt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</div>
        </section>

        <section class="card">
            <h2>Featured Image</h2>
            <div class="image-container">
                <img src="https://via.placeholder.com/400x300/38bdf8/ffffff?text=Featured+Image" alt="Placeholder Showcase Image">
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 MediaHub. All rights reserved.</p>
        </div>
    </footer>

</body>
	<script type="module" src="/src/react-app/main.tsx"></script>


</html>
